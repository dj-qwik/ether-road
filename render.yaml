# Render Blueprint — https://render.com/docs/blueprint-spec
# Ether Road on Robinhood Chain TESTNET (46630): online races + real-money (test ETH) races.
#
# Secrets are generated by Render and never shown to anyone; each service derives its own wallet from
# them. On first boot the game server deploys the escrow contract by itself once its wallet has gas.
#
# Switching to MAINNET (4663) after testing: set CHAIN_ID to "4663" and add ALLOW_RAW_KEYS_ON_MAINNET=i-understand
# (the lean launch Hot Shots runs; see README "Going to mainnet"), fund the same server wallet with ~0.005 ETH,
# then pin ESCROW_ADDRESS + ESCROW_DEPLOY_BLOCK once the server has deployed the mainnet escrow.
envVarGroups:
  - name: ether-road-secrets
    envVars:
      - key: OPERATOR_SECRET       # the server's relayer wallet (pays gas for lobby/settlement txs)
        generateValue: true
      - key: COSIGNER_A_SECRET     # result co-signer A
        generateValue: true
      - key: COSIGNER_B_SECRET     # result co-signer B
        generateValue: true
      - key: COSIGNER_AUTH_TOKEN   # the server's credential when asking co-signers to sign
        generateValue: true

services:
  - type: web
    name: ether-road-game
    runtime: node
    plan: 0.5c-512mb             # half a CPU; free instances sleep when idle and have too little CPU for 60 Hz races
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit    # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "46630"           # Robinhood Chain TESTNET (tETH). Mainnet is 4663.
      - key: PRIVY_APP_ID
        value: cmvjh7ag7002t0gidfxh6eq57   # public identifier (safe to commit)
      - key: OWNER_ADDRESS
        value: "0x9944eaEf8197ee5604C1063c525c71DE5D501a1D"   # receives the 10% house fee; guardian (can pause/veto)
      - key: EMBEDDED_COSIGNERS
        value: "2"               # 2 co-signer processes beside the server (move to separate hosts to harden)
      - key: DATABASE_URL
        fromDatabase:
          name: ether-road-db
          property: connectionString
      - fromGroup: ether-road-secrets

databases:
  - name: ether-road-db
    plan: free                   # testnet: free Postgres expires after 30 days; switch to a paid plan before real money
    region: oregon
