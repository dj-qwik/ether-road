<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
[hidden] { display: none !important; }
/* Ether Road: the live 3D road fills the screen at all times; menus are one slab laid over it, the HUD lives
   on the edges. Neon on void, per the art bible. */
:root {
  --void: #04030c; --road: #14121e; --slab: rgba(10, 8, 26, .82); --slab2: rgba(20, 16, 44, .9);
  --line: rgba(160, 150, 255, .16); --line2: rgba(160, 150, 255, .3);
  --cyan: #22e6ff; --magenta: #ff3dcb; --acid: #b6ff3b; --solar: #ff9f1c; --violet: #7a5cff; --hot: #ff2e5b;
  --text: #edebff; --muted: #8e89b3; --dim: #5d5880;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--text); font: 500 16px/1.4 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; }
body.home-on #app::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(4,3,12,.88) 0%, rgba(4,3,12,.6) 38%, rgba(4,3,12,0) 62%); }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; pointer-events: none;
  padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
#app > * { pointer-events: auto; }
/* ── top bar ── */
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.mark { font: 900 1.05rem/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; color: var(--text); }
.mark i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--cyan) 45%, #063d4a 100%); box-shadow: 0 0 12px var(--cyan), 0 0 26px rgba(34,230,255,.5); }
body.playing .mark span { display: none; }
.badge { font: 600 .72rem var(--body); color: var(--acid); border: 1px solid rgba(182,255,59,.4); border-radius: 6px; padding: 2px 7px; }
.wallet { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--slab); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; backdrop-filter: blur(10px); }
.wallet .amt { display: flex; flex-direction: column; line-height: 1.1; }
.wallet .amt small { font-size: .7rem; color: var(--muted); }
.wallet .amt b { font: 700 .95rem var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn.small { white-space: nowrap; }
@media (max-width: 480px) { .mark span { display: none; } .wallet .amt small { display: none; } }
.iconbtn { width: 40px; height: 40px; padding: 0 !important; display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
/* ── buttons ── */
.btn { --fg: var(--text); font: 700 1rem var(--body); color: var(--fg); background: rgba(255,255,255,.05); border: 1px solid var(--line2); border-radius: 10px;
  padding: 10px 16px; cursor: pointer; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { background: rgba(255,255,255,.1); border-color: rgba(200,190,255,.5); }
.btn:active { transform: translateY(1px); }
.btn.primary { --fg: #031016; background: linear-gradient(180deg, #7ff3ff, var(--cyan)); border-color: transparent; box-shadow: 0 0 0 1px rgba(34,230,255,.4), 0 0 24px rgba(34,230,255,.35); }
.btn.primary:hover { background: linear-gradient(180deg, #b3f8ff, #4aeaff); }
.btn.hot { --fg: #fff; background: linear-gradient(180deg, #ff6fda, var(--magenta)); border-color: transparent; box-shadow: 0 0 24px rgba(255,61,203,.35); }
.btn.ghost { background: transparent; }
.btn.big { font-size: 1.12rem; padding: 14px 24px; border-radius: 12px; }
.btn.small { font-size: .85rem; padding: 6px 12px; border-radius: 999px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn:focus-visible, .seg button:focus-visible, .padfocus { outline: 2px solid var(--acid) !important; outline-offset: 3px; }
.pad-only { display: none; } body.pad .pad-only { display: inline; } body.pad .no-pad { display: none; }
/* ── overlay slab ── */
#stage { position: relative; min-height: 0; }
.overlay { position: absolute; inset: 0; display: grid; align-items: center; justify-items: start; padding: 8px 0; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.card { background: linear-gradient(180deg, var(--slab2), var(--slab)); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 4px 16px 16px 4px;
  padding: 22px 24px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 14px; backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: slide .32s cubic-bezier(.2,.9,.3,1) both; }
#ov.still .card { animation: none; }
@keyframes slide { from { transform: translateX(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
.card h1, .card h2 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.08; text-wrap: balance; }
.card h2 { font-size: clamp(1.3rem, 3.2vw, 1.75rem); }
.card p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 60ch; }
.card a { color: var(--cyan); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.label { font-size: .85rem; color: var(--muted); font-weight: 600; }
kbd { font: 700 .78rem var(--body); background: rgba(255,255,255,.08); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--text); white-space: nowrap; }
.fine { font-size: .82rem; color: var(--dim); margin: 0; padding-left: 16px; display: grid; gap: 4px; }
/* ── home ── */
.home { width: min(620px, 100%); background: none; border: 0; box-shadow: none; backdrop-filter: none; padding: 8px 4px; gap: 22px; animation: none; }
.wordmark { font: 900 clamp(3rem, 11vw, 6.6rem)/.86 var(--display); letter-spacing: -.01em; margin: 0; color: var(--text);
  text-shadow: 0 0 2px rgba(255,255,255,.6), 0 0 28px rgba(34,230,255,.45), 0 0 70px rgba(255,61,203,.25); }
.wordmark span { display: block; }
.wordmark span + span { -webkit-text-stroke: 2px var(--cyan); color: transparent; text-shadow: 0 0 22px rgba(34,230,255,.6); padding-left: .55em; }
.pitch { font-size: clamp(1.02rem, 2.3vw, 1.2rem); color: var(--text); margin: 0; max-width: 36ch; line-height: 1.45; text-shadow: 0 2px 12px #000; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); max-width: 560px; }
.facts div { padding: 10px 12px 10px 0; display: grid; gap: 2px; }
.facts div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.facts b { font: 700 1.25rem var(--display); color: var(--text); }
.facts span { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.ctl { font-size: .9rem; color: var(--muted); }
/* ── lobby ── */
.lobby { width: min(720px, 100%); }
.lobby .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 680px) { .lobby .cols { grid-template-columns: 1fr; } .facts { grid-template-columns: 1fr; } .facts div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); } }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: 700 .98rem var(--body); color: var(--text); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px 6px; cursor: pointer; min-width: 64px; }
.seg button:hover { background: rgba(255,255,255,.09); }
.seg button.sel { border-color: var(--cyan); background: rgba(34,230,255,.12); color: #c9faff; box-shadow: 0 0 14px rgba(34,230,255,.25) inset; }
.seg button small { display: block; font-size: .7rem; color: var(--muted); font-weight: 500; }
.field { font: 600 1.05rem var(--body); color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; outline: none; width: 100%; user-select: text; }
.field:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,230,255,.2); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); cursor: pointer; color: var(--text); font-weight: 600; line-height: 1.35; }
.check input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--cyan); cursor: pointer; }
.check:has(input:checked) { border-color: rgba(182,255,59,.5); background: rgba(182,255,59,.06); }
.notice { display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; background: rgba(255,159,28,.07); border: 1px solid rgba(255,159,28,.35); }
.notice b { color: var(--solar); }
.addr { display: flex; gap: 8px; align-items: center; min-width: 0; }
.addr code { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0,0,0,.4); padding: 6px 8px; border-radius: 6px; flex: 1; min-width: 0; user-select: text; }
.receipt { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.25); }
.receipt .r { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; color: var(--muted); }
.receipt .r b { color: var(--text); font-weight: 700; }
.receipt .r.win { font-size: 1.02rem; color: var(--text); padding-top: 7px; border-top: 1px solid var(--line); }
.receipt .r.win b { color: var(--acid); font-size: 1.2rem; }
.seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.seat { border-radius: 10px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 4px; border: 1px dashed var(--line2); min-width: 0; min-height: 92px; align-content: center; }
.seat .orb { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 30%, #000 100%); box-shadow: 0 0 18px var(--c); }
.seat .ghost { width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--line2); display: grid; place-items: center; color: var(--dim); }
.seat .nm { font-size: .85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.seat.on { border-style: solid; border-color: var(--line2); background: rgba(255,255,255,.03); }
.seat.you { border-color: var(--c, var(--cyan)); }
/* ── sphere skins ── */
.skins { width: min(760px, 100%); }
.skingrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.skin { display: grid; justify-items: center; gap: 2px; padding: 6px 4px 8px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: 600 .82rem var(--body); cursor: pointer; }
.skin img { width: 64px; height: 64px; }
.skin:hover { background: rgba(255,255,255,.08); }
.skin.sel { border-color: var(--cyan); background: rgba(34,230,255,.1); box-shadow: 0 0 14px rgba(34,230,255,.25) inset; }
.skinbtn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; }
.skinbtn img { width: 34px; height: 34px; }
/* ── test lab ── */
.lab { width: min(760px, 100%); }
.lab .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
@media (max-width: 680px) { .lab .grid2 { grid-template-columns: 1fr; } }
.lab .seg button { min-width: 0; padding: 6px 10px; font-size: .88rem; }
#labhud { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); font: 600 .8rem/1.35 var(--body); background: rgba(4,3,12,.78); border: 1px solid var(--acid); color: var(--text); border-radius: 8px; padding: 6px 10px; pointer-events: none; text-align: center; z-index: 5; white-space: nowrap; }
#labhud kbd { font-size: .7rem; }
/* ── ready / results ── */
.intro { width: min(560px, 100%); }
.intro .theme { font: 900 clamp(1.8rem, 5vw, 2.6rem)/1 var(--display); margin: 0; }
.howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.howto li { font-size: clamp(1rem, 2.3vw, 1.15rem); font-weight: 600; padding-left: 22px; position: relative; }
.howto li::before { content: ""; position: absolute; left: 2px; top: .5em; width: 9px; height: 9px; background: var(--cyan); transform: rotate(45deg); box-shadow: 0 0 8px var(--cyan); }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
#introFill { height: 100%; width: 100%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.lineup { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px 3px 4px; font-size: .88rem; font-weight: 700; }
.chip i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 35%, #000 100%); box-shadow: 0 0 10px var(--c); }
.chip.you { border-color: var(--c); }
.result { width: min(600px, 100%); }
.result .big { font: 900 clamp(2rem, 6vw, 3.2rem)/1 var(--display); margin: 0; }
.places { display: grid; gap: 6px; }
.place { display: grid; grid-template-columns: 34px 22px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.03); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.place .n { font: 700 1rem var(--display); color: var(--muted); }
.place i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 35%, #000 100%); box-shadow: 0 0 10px var(--c); }
.place.first { border-color: var(--c); background: rgba(255,255,255,.06); }
.place.first .n { color: var(--text); }
.place .st { color: var(--muted); font-size: .88rem; }
.steps { display: grid; gap: 6px; }
.step { font-size: .92rem; color: var(--text); padding-left: 18px; position: relative; }
.step::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--acid); box-shadow: 0 0 8px var(--acid); }
.count { font: 900 clamp(1.6rem, 5vw, 2.4rem) var(--display); color: var(--acid); font-variant-numeric: tabular-nums; }
/* ── HUD (edges only: nothing over the lane ahead) ── */
#hud { position: absolute; inset: 0; pointer-events: none; }
.clock { position: absolute; top: 4px; left: 0; display: flex; align-items: center; gap: 12px; }
.clock svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.clock b { font: 900 1.7rem/1 var(--display); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
.clock small { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
.clock.low b { color: var(--hot); text-shadow: 0 0 14px var(--hot); }
.field-l { position: absolute; top: 6px; right: 0; display: grid; gap: 6px; justify-items: end; }
.racer { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 700; padding: 3px 10px 3px 4px; border-radius: 999px; background: rgba(4,3,12,.55); border: 1px solid var(--line); }
.racer i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 35%, #000 100%); box-shadow: 0 0 8px var(--c); }
.racer.you { border-color: var(--c); }
.racer.out { opacity: .4; text-decoration: line-through; }
.racer.out i { background: #333; box-shadow: none; }
.racer .gap { font-size: .78rem; color: var(--muted); font-weight: 600; }
.racer .pw { font-size: .78rem; font-weight: 700; padding: 0 4px; border-radius: 4px; }
.pw.sh { color: #6fb7ff; } .pw.mg { color: #b48cff; } .pw.db { color: #fff1a8; }
.racer em { font-style: normal; color: #ffe9a6; font-size: .8rem; }
#banner { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); font: 700 clamp(.95rem, 2.4vw, 1.15rem) var(--body); padding: 8px 18px; border-radius: 999px; background: rgba(4,3,12,.7); border: 1px solid var(--line2); white-space: nowrap; }
#callout { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
#callout b { display: block; font: 900 clamp(2.2rem, 9vw, 5.6rem)/1 var(--display); letter-spacing: -.01em; color: var(--c, #fff); text-shadow: 0 0 30px var(--c, #fff), 0 0 3px #fff; }
#callout span { display: block; margin-top: 6px; font: 600 clamp(.95rem, 2.4vw, 1.2rem) var(--body); color: var(--text); text-shadow: 0 2px 8px #000; }
#callout.pop b { animation: cpop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes cpop { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
/* held item: bottom-left, out of the way of the pipe ahead */
#hItem { position: absolute; left: 0; bottom: 6px; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 14px; background: rgba(4,3,12,.62); border: 1px solid var(--line); min-width: 150px; transition: border-color .2s, box-shadow .2s; }
#hItem .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 900 1.35rem/1 var(--display); color: var(--c, #555); background: rgba(255,255,255,.04); border: 1px dashed rgba(255,255,255,.18); }
#hItem.has { border-color: var(--c); box-shadow: 0 0 18px -4px var(--c); }
#hItem.has .ic { border: 1px solid var(--c); text-shadow: 0 0 10px var(--c); }
#hItem b { display: block; font: 800 .95rem var(--body); color: var(--c, var(--muted)); }
#hItem small { display: block; font-size: .76rem; color: var(--muted); font-weight: 600; }
#hItem .ammo { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: middle; }
#hItem .ammo i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
#useBtn { position: absolute; right: 4px; bottom: 30px; width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--c, rgba(255,255,255,.25)); background: rgba(4,3,12,.6); color: var(--c, var(--muted)); font: 900 1rem var(--display); pointer-events: auto; touch-action: none; display: none; }
body.touch #useBtn { display: block; }
#useBtn.has { box-shadow: 0 0 22px -4px var(--c); }
#net { position: absolute; right: 0; bottom: 0; font-size: .78rem; color: var(--muted); background: rgba(4,3,12,.6); border-radius: 999px; padding: 3px 10px; }
#flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 60%, transparent 40%, rgba(255,46,91,.35)); opacity: 0; transition: opacity .25s; }
#flash.on { opacity: 1; transition: none; }
</style>
<canvas id="gl" aria-label="Ether Road race view"></canvas>
<div id="flash"></div>
<div id="app">
  <header class="top">
    <div class="mark"><i></i><span>Ether Road</span></div>
    <span class="badge" id="modeBadge">Beta</span>
    <div class="wallet">
      <div class="amt"><small>Practice wallet</small><b><span id="bal">0.05</span> tETH</b></div>
      <button class="btn small" id="faucet" data-act="faucet">+ 0.05</button>
    </div>
    <button class="btn ghost iconbtn" id="mute" aria-label="Sound"></button>
  </header>
  <main id="stage">
    <div id="hud" hidden>
      <div class="clock" id="hClock"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="hRing" cx="30" cy="30" r="26" fill="none" stroke="#22e6ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="0"/></svg><div><b id="hTime">60</b><small id="hPhase">Race</small></div></div>
      <div class="field-l" id="hField"></div>
      <div id="banner" hidden></div>
      <div id="hItem"><div class="ic">·</div><div><b>No item</b><small>Roll over a pickup</small></div></div>
      <button id="useBtn" aria-label="Use item">USE</button>
      <div id="net" hidden></div>
    </div>
    <div id="callout"></div>
    <div class="overlay" id="ov"></div>
  </main>
</div>
