[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000
evm_version = "cancun"        # Arbitrum Nitro (ArbOS 20+) supports Cancun opcodes; verify on 46630 before mainnet
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2_000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "${RH_TESTNET_RPC_URL}"   # https://rpc.testnet.chain.robinhood.com (chain 46630)
robinhood = "${RH_MAINNET_RPC_URL}"           # https://rpc.mainnet.chain.robinhood.com (chain 4663)

[etherscan]
robinhood_testnet = { key = "unused", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
