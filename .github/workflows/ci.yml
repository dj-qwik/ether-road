name: ci
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm install
      - name: build game + wallet bridge (Privy)
        run: npm run build
      - name: wallet bridge output
        run: ls -la game/dist-web/wallet && du -sh game/dist-web/wallet
      - name: publish an unminified wallet bundle to the ci-wallet-debug branch (for debugging in browsers)
        if: github.ref == 'refs/heads/main'
        run: |
          WALLET_DEBUG=1 WALLET_OUT=/tmp/wallet-debug npm run build:wallet -w @etherroad/web
          npm ls @privy-io/react-auth react react-dom viem --all 2>/dev/null | head -40 > /tmp/wallet-debug/versions.txt || true
          cd /tmp/wallet-debug && git init -q && git checkout -q -b ci-wallet-debug && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "wallet debug build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-wallet-debug
      - name: determinism + network tests
        run: npm test -w @etherroad/game
      - name: real-money end to end on a local chain (deploy, deposit, match, replay-verified co-sign, payout)
        run: node game/tools/cash_e2e.mjs
      - name: real-money end to end on a local chain (deploy, deposit, match, replay-verified co-sign, payout) (mainnet settings, chain 4663)
        run: node game/tools/cash_e2e.mjs --mainnet
      - name: race rules suite (solvable, fair seats, lazy play loses, skill wins, 60 s cap, all six tracks)
        working-directory: game
        run: node tools/accept.mjs
      - name: pipes equal length, never touching, smooth to ride (every track)
        working-directory: game
        run: node tools/tracks.mjs 4
      - name: browser for the render check
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: "render check (a real race in headless Chromium, your pipe and ball must be on screen)"
        working-directory: game
        run: python3 tools/render_check.py render-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: render-check, path: game/render-out, if-no-files-found: ignore }
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: install libraries
        run: |
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - run: forge build
      - run: forge test
      - name: deployed bytecode matches the source
        run: |
          node -e "
            const a = require('./out/EtherRoadEscrow.sol/EtherRoadEscrow.json').bytecode.object
            const b = require('../packages/shared/src/escrowBytecode.json').bytecode
            if (a !== b) { console.error('escrowBytecode.json is stale - rebuild and commit'); process.exit(1) }
            console.log('bytecode matches')"
